<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Scientific Calculator</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<div class="calculator">
    <div class="header">
        <h2>♡ Cute Calculator ♡</h2>
        <p>Little calculations, big smiles ✨</p>
    </div>

    <div class="display">
        <div id="expression">Ready to calculate ✨</div>
        <div id="result">0</div>
    </div>

    <div class="buttons">
        <button class="clear" onclick="clearAll()">AC</button>
        <button class="function" onclick="del()">DEL</button>
        <button class="function" onclick="append('(')">(</button>
        <button class="function" onclick="append(')')">)</button>

        <button class="function" onclick="scientific('sin')">sin</button>
        <button class="function" onclick="scientific('cos')">cos</button>
        <button class="function" onclick="scientific('tan')">tan</button>
        <button class="operator" onclick="append('/')">÷</button>

        <button class="function" onclick="scientific('log')">log</button>
        <button class="function" onclick="scientific('ln')">ln</button>
        <button class="function" onclick="scientific('sqrt')">√</button>
        <button class="operator" onclick="append('*')">×</button>

        <button class="function" onclick="scientific('square')">x²</button>
        <button class="function" onclick="append('^')">xʸ</button>
        <button class="function" onclick="append('pi')">π</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="function" onclick="append('.')">.</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="function" onclick="append('e')">e</button>

        <button class="zero" onclick="append('0')">0</button>
        <button class="function" onclick="append('Ans')">Ans</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div class="footer">Made with ♡ just for you</div>
</div>

<script>
const expression = document.getElementById("expression");
const result = document.getElementById("result");

let input = "";
let answer = 0;
let justCalculated = false;

function update() {
    expression.textContent = input || "Ready to calculate ✨";
}

function append(value) {
    if (justCalculated && /[0-9.(]/.test(value)) {
        input = "";
    }
    justCalculated = false;
    input += value;
    update();
}

function clearAll() {
    input = "";
    result.textContent = "0";
    expression.textContent = "Ready to calculate ✨";
    justCalculated = false;
}

function del() {
    input = input.slice(0, -1);
    justCalculated = false;
    update();
}

function scientific(fn) {
    if (!input) return;
    const functions = {
        sin: "sin(",
        cos: "cos(",
        tan: "tan(",
        log: "log(",
        ln: "ln(",
        sqrt: "sqrt(",
        square: "^2"
    };
    if (fn === "square") {
        input = "(" + input + ")^2";
    } else {
        input = functions[fn] + input + ")";
    }
    justCalculated = false;
    update();
}

function calculate() {
    if (!input) return;

    try {
        let s = input
            .replace(/π/g, "pi")
            .replace(/\bpi\b/g, "Math.PI")
            .replace(/\be\b/g, "Math.E")
            .replace(/\bAns\b/g, "(" + answer + ")")
            .replace(/\^/g, "**")
            .replace(/\bsin\(/g, "Math.sin(Math.PI/180*")
            .replace(/\bcos\(/g, "Math.cos(Math.PI/180*")
            .replace(/\btan\(/g, "Math.tan(Math.PI/180*")
            .replace(/\bsqrt\(/g, "Math.sqrt(")
            .replace(/\blog\(/g, "Math.log10(")
            .replace(/\bln\(/g, "Math.log(");

        if (!/^[0-9+\-*/().,\sA-Za-z]*$/.test(s) ||
            /[A-Za-z]/.test(s.replace(
                /Math\.(PI|E|sin|cos|tan|sqrt|log10|log)/g, ""
            ))) {
            throw new Error("Invalid expression");
        }

        const value = Function('"use strict"; return (' + s + ')')();

        if (typeof value !== "number" || !Number.isFinite(value)) {
            throw new Error("Math error");
        }

        answer = value;
        expression.textContent = input + " =";
        result.textContent = Number(value.toPrecision(10)).toString();
        input = result.textContent;
        justCalculated = true;

    } catch (error) {
        result.textContent = "Oops! 💗";
        expression.textContent = "Check your expression";
        input = "";
        justCalculated = false;
    }
}

document.addEventListener("keydown", function(event) {
    if (/^[0-9().+\-*/]$/.test(event.key)) {
        append(event.key);
    } else if (event.key === "Enter" || event.key === "=") {
        calculate();
    } else if (event.key === "Backspace") {
        del();
    } else if (event.key === "Escape") {
        clearAll();
    } else if (event.key === "^") {
        append("^");
    }
});
</script>
</body>
</html>
