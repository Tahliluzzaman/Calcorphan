name: Build and Deploy Calcorphan

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate Calculator Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Required Files
        run: |
          echo "Checking Calculator files..."

          if [ ! -f index.html ]; then
            echo "ERROR: index.html not found in repository root."
            exit 1
          fi

          echo "index.html found."

          if [ -f styles.css ]; then
            echo "styles.css found."
          else
            echo "WARNING: styles.css not found."
          fi

          if [ -f app.js ]; then
            echo "app.js found."
          else
            echo "WARNING: app.js not found."
          fi

          echo "File validation completed."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    name: Deploy Calculator
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
